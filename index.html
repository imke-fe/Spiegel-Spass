<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spiegel-Spaß – Achsensymmetrie üben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e0;--ink:#3b3355;--violet:#6c5ce7;--violet-d:#4b3fb3;--red:#ff5a5f;--green:#2ecc71;--green-d:#22a35a;--orange:#ff9f43;--orange-d:#d97c22;}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(#ffe2a8 2px,transparent 2px);background-size:28px 28px;}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:2.4rem;margin:.2em 0 0;text-align:center;line-height:1.1}
h1 span{color:var(--violet)}
.sub{text-align:center;font-size:1.15rem;margin:.2em 0 1em}
.btn{font:inherit;font-weight:700;font-size:1.2rem;padding:.55em 1.2em;border-radius:999px;border:none;background:var(--violet);color:#fff;
  box-shadow:0 5px 0 var(--violet-d);cursor:pointer;transition:transform .08s;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--violet-d)}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.btn.orange{background:var(--orange);box-shadow:0 5px 0 var(--orange-d)}
.btn.light{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d6cfe8}
.btn.small{font-size:1rem;padding:.4em .9em}
.btn:disabled{opacity:.45;cursor:default}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:14px 0}
.card{background:#fff;border-radius:22px;padding:16px;text-align:center;box-shadow:0 6px 0 #eadcb8;cursor:pointer;border:3px solid transparent;transition:transform .1s}
.card:hover{transform:translateY(-3px);border-color:var(--violet)}
.card .big{font-size:2.6rem}
.card b{display:block;font-size:1.3rem}
.mascot{display:flex;flex-direction:row-reverse;align-items:flex-start;gap:16px;margin:10px 0}
.mascot .face{flex:none;width:76px;height:76px;border-radius:50%;background:#fff;border:3px solid var(--violet);box-shadow:0 4px 0 #eadcb8;overflow:hidden;animation:bob 2.4s ease-in-out infinite}
.mascot .face img{display:block;width:100%;height:100%;padding:7px 6px 5px;box-sizing:border-box;object-fit:contain;object-position:50% 50%}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
.bubble{background:#fff;border:3px solid var(--violet);border-radius:22px;padding:10px 16px;font-size:1.2rem;position:relative;box-shadow:0 4px 0 #eadcb8;flex:1;margin-top:4px}
.bubble:before{content:"";position:absolute;right:-17px;top:22px;border:14px solid transparent;border-left-color:var(--violet);border-right:0}
.bubble:after{content:"";position:absolute;right:-12px;top:25px;border:11px solid transparent;border-left-color:#fff;border-right:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #e2d7f5;display:grid;place-items:center;font-size:.9rem}
.dot.cur{border-color:var(--violet);transform:scale(1.15)}
.dot.done{background:#fff3c4;border-color:#ffd25a}
.boardbox{background:#fff;border-radius:22px;padding:10px;box-shadow:0 6px 0 #eadcb8;margin:8px 0}
svg.board{display:block;width:100%;height:auto;max-height:62vh;touch-action:none;user-select:none;-webkit-user-select:none}
.figname{text-align:center;font-size:1.5rem;font-weight:800;margin:4px 0 0}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.palette{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.sw{width:50px;height:50px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #cfc6e6;cursor:pointer;font-size:1.5rem;display:grid;place-items:center;background:#fff;touch-action:manipulation}
.sw.sel{box-shadow:0 0 0 4px var(--violet);transform:scale(1.12)}
.msg{min-height:2.2em;text-align:center;font-size:1.3rem;font-weight:700;margin:6px 0}
.msg.ok{color:var(--green-d)} .msg.no{color:#e0484d}
.toggle{display:flex;justify-content:center;align-items:center;gap:10px;font-size:1.15rem;margin:10px 0;flex-wrap:wrap}
.seg{display:inline-flex;background:#fff;border-radius:999px;padding:4px;box-shadow:0 3px 0 #eadcb8}
.seg button{font:inherit;font-weight:700;font-size:1.05rem;border:none;background:none;padding:.35em .9em;border-radius:999px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--violet);color:#fff}
.minis{display:flex;justify-content:center;gap:16px;margin:6px 0 4px}
.minis svg{width:64px;height:64px}
.end{text-align:center}
.end .mascot{text-align:left}
.end .stars{font-size:2.6rem;letter-spacing:4px;margin:10px 0}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.confetti{position:fixed;top:-20px;width:12px;height:16px;border-radius:3px;pointer-events:none;z-index:9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.hint{font-size:1rem;text-align:center;opacity:.75}
</style>
</head>

function makeGrid(f){
  const half=f[2].split(','); const w=Math.max(...half.map(r=>r.length));
  let g=half.map(r=>{const a=r.padStart(w,'.').split('');return a.concat([...a].reverse());});
  if(f[1]) g=g[0].map((_,c)=>g.map(row=>row[c]));
  const emptyRow=row=>row.every(x=>x==='.');
  while(emptyRow(g[0]))g.shift();
  while(emptyRow(g[g.length-1]))g.pop();
  const colEmpty=c=>g.every(row=>row[c]==='.');
  while(colEmpty(0))g=g.map(r=>r.slice(1));
  while(colEmpty(g[0].length-1))g=g.map(r=>r.slice(0,-1));
  return {name:f[0],vert:!f[1],g,H:g.length,W:g[0].length};
}
const POOL=FIGS.map(makeGrid);

    document.body.appendChild(d);setTimeout(()=>d.remove(),3800);
  }
}
function svgPoint(svg,e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function gridLines(cols,rows,x0=0,y0=0){
  let s='';
  for(let i=0;i<=cols;i++)s+=`<line x1="${(x0+i)*U}" y1="${y0*U}" x2="${(x0+i)*U}" y2="${(y0+rows)*U}" stroke="#d8d2ec" stroke-width="2"/>`;
  for(let j=0;j<=rows;j++)s+=`<line x1="${x0*U}" y1="${(y0+j)*U}" x2="${(x0+cols)*U}" y2="${(y0+j)*U}" stroke="#d8d2ec" stroke-width="2"/>`;
  return s;
}
function miniSVG(f){
  let s=`<svg viewBox="-1 -1 ${f.W+2} ${f.H+2}" preserveAspectRatio="xMidYMid meet">`;
  f.g.forEach((row,r)=>row.forEach((ch,c)=>{if(ch!=='.')s+=`<rect x="${c}" y="${r}" width="1.02" height="1.02" fill="${COL[ch]}"/>`;}));
  return s+'</svg>';
}

/* ---------- Zustand ---------- */
const S={easy:false,mode:'both',p1:[],p2:[],part:1,idx:0,results1:[],results2:[]};
const N1=6,N2=10;

function newSet(){
  const v=shuffle(POOL.filter(f=>f.vert)), h=shuffle(POOL.filter(f=>!f.vert));
  S.p1=shuffle([...v.splice(0,4),...h.splice(0,2)]);
  S.p2=shuffle([...v.splice(0,7),...h.splice(0,3)]);
  S.results1=[];S.results2=[];
}

/* ---------- Startseite ---------- */
function home(){
  newSet();
  const minis=shuffle(POOL).slice(0,4).map(miniSVG).join('');
  $('#app').innerHTML=`
  <h1>🪞 <span>Spiegel</span>-Spaß</h1>
  <p class="sub">Wir üben Achsensymmetrie!</p>
  <div class="minis">${minis}</div>
  ${say('Hallo! Ich bin Richi und begleite dich beim Spiegeln. Eine Figur ist <b>achsensymmetrisch</b>, wenn man sie so falten kann, dass beide Hälften genau aufeinander passen. Die Faltlinie heißt <b>Symmetrieachse</b>.')}
  <div class="cards">
    <div class="card" data-m="1"><div class="big">📏</div><b>Teil 1</b>Finde die Symmetrieachse<br><small>${N1} Aufgaben</small></div>
    <div class="card" data-m="2"><div class="big">🎨</div><b>Teil 2</b>Ergänze die Figur<br><small>${N2} Aufgaben</small></div>
    <div class="card" data-m="both"><div class="big">🚀</div><b>Alles</b>Teil 1 und Teil 2<br><small>${N1+N2} Aufgaben</small></div>
  </div>
  <div class="toggle">Teil 2:
    <div class="seg"><button data-e="0" class="${S.easy?'':'on'}">🎨 mit Farben</button><button data-e="1" class="${S.easy?'on':''}">✏️ ohne Farben (leichter)</button></div>
  </div>`;
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{S.mode=c.dataset.m;S.idx=0;S.part=S.mode==='2'?2:1;startTask();});
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.easy=b.dataset.e==='1';document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));});
}

function topBar(){
  const n=S.part===1?N1:N2, res=S.part===1?S.results1:S.results2;
  let dots='';for(let i=0;i<n;i++)dots+=`<div class="dot ${i===S.idx?'cur':''} ${res[i]!==undefined?'done':''}">${res[i]===true?'⭐':res[i]===false?'✔️':''}</div>`;
  return `<div class="top"><button class="btn light small" id="homeBtn">🏠 Start</button>
    <b style="font-size:1.25rem">Teil ${S.part}: Aufgabe ${S.idx+1} von ${n}</b></div><div class="dots" style="margin-top:8px">${dots}</div>`;
}
function bindHome(){$('#homeBtn').onclick=home;}
function say(t){return `<div class="mascot">${FACE}<div class="bubble">${t}</div></div>`;}

function startTask(){ S.part===1?part1():part2(); window.scrollTo({top:0,behavior:'smooth'}); }
function next(){
  S.idx++;
  const n=S.part===1?N1:N2;
  if(S.idx<n) return startTask();
  if(S.part===1&&S.mode==='both'){S.part=2;S.idx=0;return interlude();}
  finish();
}
function interlude(){
  $('#app').innerHTML=`<div class="end"><h1>Teil 1 geschafft! 🎉</h1>
   <div class="stars">${S.results1.map(r=>r?'⭐':'✔️').join('')}</div>
   ${say('Jetzt wird es kniffliger: Du bekommst nur eine Hälfte und malst die andere Hälfte dazu!')}
   <button class="btn green" id="go">Weiter zu Teil 2 ➜</button></div>`;
  confetti();$('#go').onclick=startTask;
}
function finish(){
  const all=[...S.results1,...S.results2], st=all.filter(x=>x).length;
  $('#app').innerHTML=`<div class="end"><h1>Geschafft! 🏆</h1>
   <div class="stars">${all.map(r=>r?'⭐':'✔️').join('')}</div>
   ${say(`Du hast <b>${st}</b> von ${all.length} Aufgaben gleich beim ersten Versuch gelöst. ${st>=all.length*0.8?'Du bist ein echter Spiegel-Profi!':'Übung macht den Meister – probier es gleich nochmal!'}`)}
   <div class="controls"><button class="btn green" id="again">🔄 Neue Aufgaben</button><button class="btn light" id="h">🏠 Startseite</button></div>
   <p class="hint">⭐ = beim ersten Versuch richtig &nbsp; ✔️ = mit mehreren Versuchen geschafft</p></div>`;
  confetti();
  $('#again').onclick=()=>{newSet();S.idx=0;S.part=S.mode==='2'?2:1;startTask();};
  $('#h').onclick=home;
}

/* ---------- TEIL 1: Achse verschieben ---------- */
function part1(){
  const f=S.p1[S.idx], vert=f.vert;
  const mL=rand(1,4),mR=rand(1,4),mT=rand(1,2),mB=rand(1,2);
  const t={f,vert,ox:vert?mL:mT,oy:vert?mT:mL,tries:0,done:false,ghost:false};
  t.cols=vert?f.W+mL+mR:f.W+mT+mB; t.rows=vert?f.H+mT+mB:f.H+mL+mR;
  if(!vert){t.ox=mT;t.oy=mL;}
  t.correct=vert?t.ox+f.W/2:t.oy+f.H/2;
  const max=(vert?t.cols:t.rows)-1;
  const opts=[];for(let i=1;i<=max;i++)if(Math.abs(i-t.correct)>=2)opts.push(i);
  t.pos=pick(opts);
  S.t=t;
  const dir=vert?'nach links oder rechts':'nach oben oder unten';
  $('#app').innerHTML=topBar()+say(`Schieb die <b style="color:#ff5a5f">rote Linie</b> ${dir}, bis sie genau auf der Symmetrieachse liegt. Dann drück auf <b>Prüfen</b>!`)+`
   <div class="boardbox"><div class="figname">${f.name}</div><svg class="board" id="board" viewBox="0 0 ${t.cols*U} ${t.rows*U}">
    <rect width="${t.cols*U}" height="${t.rows*U}" fill="#fff"/>${gridLines(t.cols,t.rows)}
    <g>${f.g.map((row,r)=>row.map((ch,c)=>ch==='.'?'':`<rect x="${(t.ox+c)*U+1}" y="${(t.oy+r)*U+1}" width="${U-2}" height="${U-2}" rx="5" fill="${COL[ch]}"/>`).join('')).join('')}</g>
    <g id="ghost"></g><g id="axis"></g></svg></div>
   <div class="msg" id="msg"></div>
   <div class="controls" id="ctrl">
     <button class="btn light" id="m1">${vert?'◀':'▲'}</button>
     <button class="btn light" id="p1">${vert?'▶':'▼'}</button>
     <button class="btn orange" id="tip">👀 Tipp</button>
     <button class="btn green" id="check">✅ Prüfen</button>
   </div>`;
  bindHome(); drawAxis();
  const svg=$('#board'); let drag=false;
  const move=e=>{if(t.done)return;const p=svgPoint(svg,e);let v=Math.round((vert?p.x:p.y)/U);v=Math.max(1,Math.min(max,v));if(v!==t.pos){t.pos=v;t.ghost=false;$('#msg').textContent='';drawAxis();}};
  svg.addEventListener('pointerdown',e=>{drag=true;try{svg.setPointerCapture(e.pointerId)}catch(_){}move(e);});
  svg.addEventListener('pointermove',e=>{if(drag)move(e);});
  svg.addEventListener('pointerup',()=>drag=false);svg.addEventListener('pointercancel',()=>drag=false);
  const step=d=>{if(t.done)return;t.pos=Math.max(1,Math.min(max,t.pos+d));t.ghost=false;$('#msg').textContent='';drawAxis();};
  $('#m1').onclick=()=>step(-1);$('#p1').onclick=()=>step(1);
  $('#tip').onclick=()=>{t.ghost=!t.ghost;drawAxis();$('#msg').className='msg';$('#msg').textContent=t.ghost?'So sieht die Figur gespiegelt an deiner Linie aus.':'';};
  $('#check').onclick=checkP1;
}
function drawAxis(){
  const t=S.t,f=t.f,W=t.cols*U,H=t.rows*U;let g='';
  if(t.ghost){
    f.g.forEach((row,r)=>row.forEach((ch,c)=>{
      if(ch==='.')return;
      let x=t.ox+c,y=t.oy+r;
      if(t.vert)x=2*t.pos-x-1;else y=2*t.pos-y-1;
      if(x<0||y<0||x>=t.cols||y>=t.rows)return;
      g+=`<rect x="${x*U+4}" y="${y*U+4}" width="${U-8}" height="${U-8}" rx="5" fill="${COL[ch]}" fill-opacity=".45" stroke="${COL[ch]}" stroke-width="3" stroke-dasharray="6 4"/>`;
    }));
  }
  $('#ghost').innerHTML=g;
  const col=t.done?'#2ecc71':'#ff5a5f';
  let a;
  if(t.vert){const x=t.pos*U;
    a=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${col}" stroke-width="8" stroke-dasharray="18 10" stroke-linecap="round"/>
       ${[22,H-22].map(y=>`<circle cx="${x}" cy="${y}" r="20" fill="${col}"/><text x="${x}" y="${y+7}" text-anchor="middle" font-size="22" fill="#fff" font-weight="bold">↔</text>`).join('')}`;
  }else{const y=t.pos*U;
    a=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${col}" stroke-width="8" stroke-dasharray="18 10" stroke-linecap="round"/>
       ${[22,W-22].map(x=>`<circle cx="${x}" cy="${y}" r="20" fill="${col}"/><text x="${x}" y="${y+8}" text-anchor="middle" font-size="22" fill="#fff" font-weight="bold">↕</text>`).join('')}`;
  }
  $('#axis').innerHTML=a;
}
function checkP1(){
  const t=S.t;if(t.done)return;const m=$('#msg');
  if(t.pos===t.correct){
    t.done=true;t.ghost=true;drawAxis();
    S.results1[S.idx]=t.tries===0;
    m.className='msg ok';m.textContent=pick(PRAISE)+' Beide Hälften passen genau aufeinander.';
    confetti();
    $('#ctrl').innerHTML=`<button class="btn green" id="nx">Weiter ➜</button>`;$('#nx').onclick=next;
  }else{
    t.tries++;t.ghost=true;drawAxis();
    m.className='msg no';m.textContent='Noch nicht! Schau: Gespiegelt passt die Figur nicht auf sich selbst. Versuch es nochmal!';
    const b=$('#board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
  }
}

/* ---------- TEIL 2: Figur ergänzen ---------- */
function part2(){
  const f=S.p2[S.idx], vert=f.vert;
  const side=vert?pick(['L','R']):pick(['T','B']);
  const t={f,vert,side,tries:0,done:false,user:f.g.map(r=>r.map(()=>'.')),painting:null};
  t.cols=f.W+2;t.rows=f.H+2;
  t.edit=(r,c)=>vert?(side==='L'?c>=f.W/2:c<f.W/2):(side==='T'?r>=f.H/2:r<f.H/2);
  t.colors=[...new Set(f.g.flat().filter(x=>x!=='.'))];
  S.color=S.easy?'x':t.colors[0];
  S.t=t;
  const where=vert?(side==='L'?'rechte':'linke'):(side==='T'?'untere':'obere');
  $('#app').innerHTML=topBar()+say(`Hier siehst du nur eine Hälfte. Male die <b>${where} Hälfte</b> dazu, sodass die Figur symmetrisch wird! ${S.easy?'Tippe auf die Kästchen.':'Wähle zuerst eine Farbe, dann tippe auf die Kästchen.'}`)+`
   <div class="boardbox"><div class="figname">${f.name}</div>
   <svg class="board" id="board" viewBox="0 0 ${t.cols*U} ${t.rows*U}"></svg></div>
   <div class="palette" id="pal"></div>
   <div class="msg" id="msg"></div>
   <div class="controls" id="ctrl">
     <button class="btn light" id="clr">🧹 Alles löschen</button>
     <button class="btn green" id="check">✅ Prüfen</button>
   </div>`;
  bindHome(); drawBoard2(); drawPalette();
  const svg=$('#board');
  const cellAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.dataset&&el.dataset.r!==undefined?el:null;};
  const apply=el=>{
    const r=+el.dataset.r,c=+el.dataset.c;
    if(t.painting==='erase')t.user[r][c]='.';else t.user[r][c]=S.color;
    el.setAttribute('fill',t.user[r][c]==='.'?'#fffbe6':COL[t.user[r][c]]);
  };
  svg.addEventListener('pointerdown',e=>{
    if(t.done)return;const el=cellAt(e);if(!el)return;e.preventDefault();
    const cur=t.user[+el.dataset.r][+el.dataset.c];
    t.painting=(S.color==='erase'||cur===S.color)?'erase':'paint';
    $('#marks').innerHTML='';$('#msg').textContent='';apply(el);
  });
  svg.addEventListener('pointermove',e=>{if(!t.painting||t.done)return;const el=cellAt(e);if(el)apply(el);});
  window.onpointerup=()=>{t.painting=null;};
  $('#clr').onclick=()=>{if(t.done)return;t.user=f.g.map(r=>r.map(()=>'.'));drawBoard2();$('#msg').textContent='';};
  $('#check').onclick=checkP2;
}
function drawBoard2(){
  const t=S.t,f=t.f;let s=`<rect width="${t.cols*U}" height="${t.rows*U}" fill="#fff"/>`;
  f.g.forEach((row,r)=>row.forEach((ch,c)=>{
    const x=(c+1)*U,y=(r+1)*U;
    if(t.edit(r,c)){const u=t.user[r][c];
      s+=`<rect data-r="${r}" data-c="${c}" x="${x}" y="${y}" width="${U}" height="${U}" fill="${u==='.'?'#fffbe6':COL[u]}" style="cursor:pointer"/>`;
    }else if(ch!=='.') s+=`<rect x="${x}" y="${y}" width="${U}" height="${U}" fill="${COL[ch]}"/>`;
  }));
  s+=`<g pointer-events="none">${gridLines(t.cols,t.rows)}<rect x="${U}" y="${U}" width="${f.W*U}" height="${f.H*U}" fill="none" stroke="#b9aee0" stroke-width="3"/>`;
  if(t.vert){const x=(1+f.W/2)*U;s+=`<line x1="${x}" y1="6" x2="${x}" y2="${t.rows*U-6}" stroke="#ff5a5f" stroke-width="7" stroke-dasharray="16 9" stroke-linecap="round"/>`;}
  else{const y=(1+f.H/2)*U;s+=`<line x1="6" y1="${y}" x2="${t.cols*U-6}" y2="${y}" stroke="#ff5a5f" stroke-width="7" stroke-dasharray="16 9" stroke-linecap="round"/>`;}
  s+=`<g id="marks"></g></g>`;
  $('#board').innerHTML=s;
}
function drawPalette(){
  const t=S.t;
  const items=S.easy?['x','erase']:[...t.colors,'erase'];
  $('#pal').innerHTML=items.map(k=>k==='erase'
    ?`<div class="sw ${S.color==='erase'?'sel':''}" data-k="erase" title="Radiergummi">🧽</div>`
    :`<div class="sw ${S.color===k?'sel':''}" data-k="${k}" title="${COLNAME[k]||'Stift'}" style="background:${COL[k]}">${k==='x'?'✏️':''}</div>`).join('');
  document.querySelectorAll('.sw').forEach(el=>el.onclick=()=>{S.color=el.dataset.k;drawPalette();});
}
function checkP2(){
  const t=S.t,f=t.f;if(t.done)return;const wrong=[];
  f.g.forEach((row,r)=>row.forEach((sol,c)=>{
    if(!t.edit(r,c))return;const u=t.user[r][c];
    const ok=S.easy?((sol!=='.')===(u!=='.')):sol===u;
    if(!ok)wrong.push([r,c]);
  }));
  const m=$('#msg');
  if(!wrong.length){
    t.done=true;S.results2[S.idx]=t.tries===0;
    t.user=f.g.map(r=>r.slice());drawBoard2();
    m.className='msg ok';m.textContent=pick(PRAISE)+' Die Figur ist jetzt symmetrisch.';confetti();
    $('#pal').innerHTML='';
    $('#ctrl').innerHTML=`<button class="btn green" id="nx">Weiter ➜</button>`;$('#nx').onclick=next;
    return;
  }
  t.tries++;
  $('#marks').innerHTML=wrong.map(([r,c])=>{const x=(c+1)*U,y=(r+1)*U;
    return `<path d="M${x+9} ${y+9}L${x+U-9} ${y+U-9}M${x+U-9} ${y+9}L${x+9} ${y+U-9}" stroke="#e0262d" stroke-width="5" stroke-linecap="round"/>`;}).join('');
  m.className='msg no';
  m.textContent=wrong.length===1?'Fast! Nur noch 1 Kästchen stimmt nicht – schau beim roten Kreuz.':`Noch ${wrong.length} Kästchen stimmen nicht. Die roten Kreuze zeigen dir, wo.`;
  const b=$('#board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
  if(t.tries>=2&&!$('#sol')){
    const btn=document.createElement('button');btn.className='btn orange';btn.id='sol';btn.textContent='💡 Lösung zeigen';
    btn.onclick=()=>{t.done=true;S.results2[S.idx]=false;t.user=f.g.map(r=>r.slice());drawBoard2();$('#pal').innerHTML='';
      m.className='msg';m.textContent='So sieht die fertige Figur aus. Vergleiche die beiden Hälften!';
      $('#ctrl').innerHTML=`<button class="btn green" id="nx">Weiter ➜</button>`;$('#nx').onclick=next;};
    $('#ctrl').prepend(btn);
  }
}

home();
</script>
</body>
</html>
